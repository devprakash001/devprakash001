<svg width="100%" height="70" viewBox="0 0 1200 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0" />
      <stop offset="25%" style="stop-color:#00D4FF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FF00FF;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#00D4FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Animated background lines -->
  <rect x="0" y="30" width="100%" height="2" fill="url(#cyberGradient)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Main cyber line -->
  <rect x="0" y="34" width="100%" height="2" fill="url(#cyberGradient)" filter="url(#glow)">
    <animate attributeName="width" values="0%;100%;0%" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Floating particles -->
  <circle cx="100" cy="35" r="1" fill="#00D4FF">
    <animate attributeName="cx" values="100;1100;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="300" cy="35" r="1" fill="#FF00FF">
    <animate attributeName="cx" values="300;900;300" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="500" cy="35" r="1" fill="#00D4FF">
    <animate attributeName="cx" values="500;700;500" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Cyber grid pattern -->
  <g opacity="0.2">
    <line x1="0" y1="20" x2="1200" y2="20" stroke="#00D4FF" stroke-width="1">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#00D4FF" stroke-width="1">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
